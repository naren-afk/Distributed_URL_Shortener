services:
  # Managed PostgreSQL Replica / Container
  db:
    image: postgres:16-alpine
    container_name: urlshortener_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: urlshortener
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urlshortener"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis In-Memory Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: urlshortener_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Horizontally Scaled App Node 1
  app1:
    build: .
    container_name: urlshortener_app1
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/urlshortener
      REDIS_URL: redis://redis:6379/0
      BASE_URL: http://localhost
      ENVIRONMENT: production
      DB_POOL_SIZE: 15
      DB_MAX_OVERFLOW: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Horizontally Scaled App Node 2
  app2:
    build: .
    container_name: urlshortener_app2
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/urlshortener
      REDIS_URL: redis://redis:6379/0
      BASE_URL: http://localhost
      ENVIRONMENT: production
      DB_POOL_SIZE: 15
      DB_MAX_OVERFLOW: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Horizontally Scaled App Node 3
  app3:
    build: .
    container_name: urlshortener_app3
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/urlshortener
      REDIS_URL: redis://redis:6379/0
      BASE_URL: http://localhost
      ENVIRONMENT: production
      DB_POOL_SIZE: 15
      DB_MAX_OVERFLOW: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Asynchronous Analytics Worker Process
  worker:
    build: .
    container_name: urlshortener_worker
    restart: always
    command: ["python", "-m", "app.workers.analytics_worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/urlshortener
      REDIS_URL: redis://redis:6379/0
      WORKER_BATCH_SIZE: 50
      WORKER_POLL_INTERVAL: 1.0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Nginx Load Balancer & Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: urlshortener_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3

volumes:
  postgres_data:
  redis_data:
